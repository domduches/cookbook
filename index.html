<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Livre de Recettes ∙ Cookbook</title>
    <style>
        :root {
            --bg-color: #fdfaf6;
            --card-bg: #ffffff;
            --text-color: #4a3e3d;
            --accent-color: #d27d56;
            --accent-dark: #b8623b;
            --accent-light: #e6dfd3;
            --bg-hover: #f9f6f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 4px 25px rgba(210, 125, 86, 0.05);
            text-align: center;
        }

        .logo {
            font-size: 3.5rem;
            margin-bottom: 10px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            font-size: 2.2rem;
            color: #2b2b2b;
            margin: 0 0 10px 0;
            font-weight: 700;
        }

        p.subtitle {
            font-size: 1rem;
            opacity: 0.6;
            margin: 0 0 40px 0;
            font-style: italic;
        }

        h2 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-color);
            opacity: 0.8;
            border-bottom: 2px solid var(--bg-hover);
            padding-bottom: 8px;
            margin-bottom: 20px;
            text-align: left;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }

        li {
            margin-bottom: 15px;
        }

        .recipe-link {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background-color: var(--card-bg);
            border: 1px solid var(--accent-light);
            border-radius: 14px;
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 2px 5px rgba(0,0,0,0.01);
        }

        .recipe-link:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
            background-color: var(--bg-hover);
            box-shadow: 0 4px 12px rgba(210, 125, 86, 0.08);
            color: var(--accent-dark);
        }

        .recipe-emoji {
            font-size: 1.4rem;
            margin-right: 15px;
        }

        footer {
            margin-top: 50px;
            font-size: 0.85rem;
            opacity: 0.4;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">👩‍🍳</div>
    <h1>Mon Petit Cookbook</h1>
    <p class="subtitle">Mes recettes testées et approuvées pour la cuisine mobile</p>

    <h2>🍲 Les Soupes & Veloutés</h2>
    <ul>
        <li>
            <a href="veloute_citrouille_pomme_cumin.html" class="recipe-link">
                <span class="recipe-emoji">🎃</span>
                <span>Velouté de Citrouille, Pomme et Cumin Entier</span>
            </a>
        </li>
        <li>
            <a href="veloute_citrouille_ail_noir.html" class="recipe-link">
                <span class="recipe-emoji">🖤</span>
                <span>Velouté de Citrouille à l'Ail Noir</span>
            </a>
        </li>
        <li>
            <a href="veloute_citrouille_lentilles_os_moelle.html" class="recipe-link">
                <span class="recipe-emoji">🦴</span>
                <span>Velouté de Citrouille, Lentilles et Os à Moelle</span>
            </a>
        </li>
    </ul>

    <footer>
        Créé avec amour • Propulsé par GitHub Pages
    </footer>
</div>

</body>
</html>
